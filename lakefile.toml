name = "lint-style-tester"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LintStyleTester"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
weak.linter.trailingWhitespace = true

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "LintStyleTester"
